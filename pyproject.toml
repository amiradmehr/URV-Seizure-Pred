[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urv-seizure-prediction"
version = "0.1.0"
description = "Behind-the-ear EEG seizure prediction research pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "mne>=1.7",
    "mne-bids>=0.17",
    "braindecode>=1.3",
    "torch>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
